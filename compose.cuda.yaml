# GPU overlay for the Laya sidecar (needs the NVIDIA Container Toolkit):
#   docker compose -f compose.yaml -f compose.cuda.yaml up --build
services:
  laya-serve:
    build:
      args:
        TORCH_INDEX: cu128
    image: laya-serve:0.3.27-cu128
    environment:
      LAYA_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
