<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments :: pageHead(${title})}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: pageHeader(null)}"></header>
<main>
    <div class="card" style="max-width:560px;margin:0 auto">
        <h1 th:text="${title}">Error</h1>
        <p th:text="${message}">Something went wrong.</p>
        <p th:if="${retry}"><a th:href="@{/}">Go to KINA</a></p>
    </div>
</main>
<footer th:replace="~{fragments :: pageFooter}"></footer>
</body>
</html>
