spring:
  application.name: kina
  threads.virtual.enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kina}
    username: ${SPRING_DATASOURCE_USERNAME:kina}
    password: ${SPRING_DATASOURCE_PASSWORD:kina}
  flyway.enabled: true
  ai.mcp.server:
    name: kina
    version: "@project.version@"
    type: SYNC
    protocol: STATELESS
    streamable-http.mcp-endpoint: /mcp
    request-timeout: 3m           # above kina.search.max-request-duration (rate-limit waits)
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:                    # DESIGN.md 3.7: actuator (health, info, prometheus) on its own port, no authentication
  server.port: ${KINA_METRICS_PORT:9090}
  endpoints.web.exposure.include: health,info,prometheus
  prometheus.metrics.export.enabled: true
kina:
  public-base-url: ${KINA_PUBLIC_BASE_URL:}
  security.mode: ${KINA_MODE:dev}
  security.oidc:
    issuer-uri: "${OIDC_ISSUER_URI:}"
    client-id: "${OIDC_CLIENT_ID:}"
    client-secret: "${OIDC_CLIENT_SECRET:}"
    groups-claim: "${OIDC_GROUPS_CLAIM:groups}"                 # ID token first, then userinfo; dotted path for nested claims
    required-groups: "${OIDC_REQUIRED_GROUPS:}"                 # comma separated; empty = no group check
    allowed-email-domains: "${OIDC_ALLOWED_EMAIL_DOMAINS:}"     # comma separated; empty = any domain
    email-from-preferred-username: ${OIDC_EMAIL_FROM_PREFERRED_USERNAME:false}  # no email claim: use preferred_username/upn if it has an @
    require-verified-email: ${OIDC_REQUIRE_VERIFIED_EMAIL:true}  # false: ignore email_verified=false, check only the domain
    extra-scopes: "${OIDC_EXTRA_SCOPES:}"                       # offline_access is added automatically (DESIGN.md 7.1)
    token-encryption-key: "${KINA_TOKEN_ENCRYPTION_KEY:}"       # base64 of 32 bytes; unset = upstream refresh tokens not stored
    membership-recheck-interval: ${KINA_MEMBERSHIP_RECHECK_INTERVAL:1h}
    membership-grace: ${KINA_MEMBERSHIP_GRACE:4h}
    relogin-interval-without-recheck: ${KINA_RELOGIN_INTERVAL_WITHOUT_RECHECK:24h}
  tokens:
    validity: 30d                                               # static tokens created in the web UI
    ui-enabled: ${KINA_TOKENS_UI_ENABLED:true}
  oauth:
    access-token-validity: ${KINA_OAUTH_ACCESS_TOKEN_VALIDITY:1h}
    refresh-token-validity: ${KINA_OAUTH_REFRESH_TOKEN_VALIDITY:30d}
    trusted-client-metadata-hosts: "${KINA_OAUTH_TRUSTED_CLIENT_HOSTS:claude.ai,claude.com,*.anthropic.com}"
    client-metadata-cache: 1h
    auto-approve-trusted-clients: ${KINA_OAUTH_AUTO_APPROVE_TRUSTED_CLIENTS:true}
    unused-client-retention: 90d
    register-rate-limit-per-minute: ${KINA_OAUTH_REGISTER_RATE_LIMIT_PER_MINUTE:30}
  cache:
    ttl: ${KINA_CACHE_TTL:3d}                # DESIGN.md 3.2: search lists, and stock/prices before they are marked stale
    empty-result-ttl: 1h
    stock-ttl: ${KINA_CACHE_STOCK_TTL:24h}   # DESIGN.md 3.2: older cached stock/prices are refreshed before they are returned
    metadata-retention:                      # per distributor: forever (default) or a duration, e.g. 3d (OPERATIONS.md)
      TME: ${KINA_CACHE_METADATA_RETENTION_TME:forever}
      MOUSER: ${KINA_CACHE_METADATA_RETENTION_MOUSER:forever}
    stale-rank-penalty: ${KINA_CACHE_STALE_RANK_PENALTY:1.0}   # 1.0 ranks every stale part below every fresh one
  search:
    candidate-window: 40
    default-max-results: 10
    max-max-results: 50
    distributor-timeout: 20s
    max-request-duration: 2m     # hard cap per request, including rate-limit waits (DESIGN.md 3.6)
    strict-constraints: ${KINA_STRICT_CONSTRAINTS:}   # deprecated: use hard-constraints (unset = the code defaults)
    # hard-constraints:           # DESIGN.md 3.4: per family the constraints that are never relaxed (unset = the decided
    #   capacitor: value,package,mounting,technology,elements,type   # defaults of search.ConstraintPolicy); env form:
    #                                                               # KINA_SEARCH_HARDCONSTRAINTS_CAPACITOR=value,package
    low-stock-threshold: ${KINA_LOW_STOCK_THRESHOLD:10}   # stock below this (or below 2 x quantity) is low_stock
    quantity:                    # DESIGN.md 3.4 "Quantity": score penalties for the order quantity and stock
      stock-shortfall-penalty: 0.3
      moq-penalty: 0.3           # x min(1, log10(moq / quantity) / 3), also for quantity 1
      low-stock-penalty: 0.3
    lifecycle:                   # DESIGN.md 3.4: penalties by the part's lifecycle
      last-time-buy-penalty: 0.1
      supply-constrained-penalty: 0.05
    field-index:                 # DESIGN.md 3.8: part_index, written with the cache and re-indexed after startup
      mode: ${KINA_FIELD_INDEX_MODE:off}                 # off | shadow (log and count only) | augment | on (phase B)
      min-version: ${KINA_FIELD_INDEX_MIN_VERSION:0}     # rows of an older extractor are kept by every rule but family
      max-candidates: 200
      reindex-batch-size: 500
      reindex-enabled: ${KINA_FIELD_INDEX_REINDEX_ENABLED:true}
  ranking:
    timeout: 5s                  # per query; the cross-encoder needs about 0.1-0.35 s for 40 candidates
    batch-timeout: 60s
    score-cache-ttl: 1h
    cross-encoder:               # DESIGN.md 3.5: in-process MiniLM cross-encoder (ONNX Runtime), 50/50 rank blend
      enabled: ${KINA_CROSS_ENCODER_ENABLED:true}
      variant: ${KINA_CROSS_ENCODER_VARIANT:int8}
      model-dir: "${KINA_CROSS_ENCODER_MODEL_DIR:${KINA_JLCPCB_DATA_DIR:./data/jlcpcb}/../cross-encoder}"
      model-url: "${KINA_CROSS_ENCODER_MODEL_URL:https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2/resolve/main/}"
      threads: ${KINA_CROSS_ENCODER_THREADS:0}      # 0 = min(4, available processors)
      max-concurrent: 2
      batch-size: 16
      max-sequence-length: 256
      max-candidates: 40
      weight: 0.5
      check-interval: 1h
      download-timeout: 10m
      auto-download: ${KINA_CROSS_ENCODER_AUTO_DOWNLOAD:true}   # false in the Docker image (model bundled, DESIGN.md 11)
  distributors:
    mouser: { api-key: "${MOUSER_API_KEY:}", base-url: https://api.mouser.com/api/v1, max-results-per-search: 50, max-pages-per-search: 1 }
    tme:    { token: "${TME_TOKEN:}", secret: "${TME_APPLICATION_SECRET:}", country: "${COUNTRY:RO}", currency: EUR, language: en, base-url: https://api.tme.eu, max-results-per-search: 60, max-pages-per-search: 3,
            excluded-statuses: [CANNOT_BE_ORDERED, ONLY_FOR_SPECIAL_ORDER, EXTERNAL_WAREHOUSE, NOT_IN_OFFER,
                                PRODUCT_BLOCKED, INVALID, "BLOCKED_FOR_ZBL_*"] }
  metrics:
    save-interval: 30s           # counters saved to metrics_counters, database gauges recomputed (DESIGN.md 3.7)
    backfill:                    # moves type="unknown" counts to the types the database shows (DESIGN.md 3.7)
      cron: "${KINA_METRICS_BACKFILL_CRON:0 0 6 * * *}"     # daily at 06:00, JVM time zone; also once at the first start
      enabled: ${KINA_METRICS_BACKFILL_ENABLED:true}
      batch-size: 2000           # rows re-typed per UPDATE
  jlcpcb: { data-dir: "${KINA_JLCPCB_DATA_DIR:./data/jlcpcb}", library: "${KINA_JLCPCB_LIBRARY:parts-fts5.db}", base-url: https://bouni.github.io/kicad-jlcpcb-tools/, refresh-after: 5d, check-interval: 1h, max-results-per-search: 200,
            auto-download: true, pool-size: "${KINA_JLCPCB_POOL_SIZE:4}", pool-wait: "${KINA_JLCPCB_POOL_WAIT:10s}",
            field-index: { enabled: "${KINA_JLCPCB_FIELD_INDEX_ENABLED:false}", threads: "${KINA_JLCPCB_FIELD_INDEX_THREADS:0}" } }   # DESIGN.md 9.3
