# Test-only overrides, layered on top of src/main/resources/application.yml (classpath:/config/ wins).
kina:
  jlcpcb:
    # Spring tests must never download the ~1 GB JLCPCB database from the internet.
    auto-download: false
    data-dir: target/test-data/jlcpcb
  ranking:
    cross-encoder:
      # Spring tests must never download the cross-encoder model either; without files the ranking falls back.
      auto-download: false
      model-dir: target/test-data/cross-encoder
  oauth:
    # Every test of a shared context registers clients from 127.0.0.1; the limit itself is tested in its own context.
    register-rate-limit-per-minute: 100000
  metrics:
    backfill:
      # A background run at startup would race with tests that seed counters; the backfill tests run it by hand.
      enabled: false
