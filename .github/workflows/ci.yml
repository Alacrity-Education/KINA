name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests use Testcontainers (PostgreSQL 17); the runner's Docker daemon is enough.
      - name: Build and test
        run: ./mvnw -B -q verify

      - name: Docker build (no push)
        run: docker build -t kina:ci .
