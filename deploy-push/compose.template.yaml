# KINA: app + PostgreSQL, deployed with deploy-push/deploy-push.sh.
# deploy-push.sh generates compose.yaml from this template on every run (it overwrites the file):
# the kina image line names the pushed tag. No build: the image is loaded into the server's Docker daemon.
#   edit .env (copied from .env.example on the first deploy only)
#   docker compose up -d
# Keep everything except comments and the kina build/image/pull_policy lines identical to the root
# compose.yaml; deploy-push/check-template.sh enforces it.
# Resource hints (measured on a 24-core / 30 GB host, see docs/DEVELOPMENT.md):
#   kina        ~0.5-1 GB RAM (heap = 75% of mem_limit) plus ~150-250 MB native memory for the in-process
#               cross-encoder (ONNX Runtime, DESIGN.md 3.5); ranking 40 candidates takes ~0.1-0.35 s of CPU on
#               KINA_CROSS_ENCODER_THREADS (default min(4, cores)) threads. The JLCPCB SQLite file (~5.3 GB) is read
#               through the OS page cache, so free host RAM makes LCSC searches faster but is not required.
#   postgres    < 100 MB RAM.
#   disk        ~5.3 GB JLCPCB database (kina-data:/data/jlcpcb). The cross-encoder model (~140 MB, int8 and fp32)
#               is in the image at /opt/kina/cross-encoder; the container never downloads it (DESIGN.md 3.5, 11).
name: kina

services:
  kina:
    image: __KINA_IMAGE__
    pull_policy: never
    ports:
      - "${KINA_PORT:-8080}:8080"
      # Management port: actuator health and Prometheus (/actuator/prometheus) WITHOUT authentication.
      # Bound to localhost by default; expose it only to the monitoring network (DESIGN.md 3.7).
      - "${KINA_METRICS_BIND:-127.0.0.1}:${KINA_METRICS_PORT:-9090}:9090"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kina
      SPRING_DATASOURCE_USERNAME: kina
      SPRING_DATASOURCE_PASSWORD: kina
      KINA_JLCPCB_DATA_DIR: /data/jlcpcb
      KINA_METRICS_PORT: "9090"   # inside the container; KINA_METRICS_PORT in .env only picks the host port
    volumes:
      - kina-data:/data
    # The JVM heap is 75% of this limit (Dockerfile ENTRYPOINT: -XX:MaxRAMPercentage=75).
    mem_limit: ${KINA_MEM_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kina
      POSTGRES_USER: kina
      POSTGRES_PASSWORD: kina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kina -d kina"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kina-data:
  pgdata:
